<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Vistas de Caberti: regalos, detalles y productos personalizados en Tapachula."
    />
    <meta name="theme-color" content="#a84732" />
    <title>Productos | Caberti</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="../js/data.js" defer></script>
    <script src="../js/admin.js" defer></script>
  </head>
  <body data-page="productos" data-admin="true">
    <a class="skip-link" href="#contenido">Saltar al contenido</a
    ><noscript
      ><div class="noscript">
        Activa JavaScript para ver los productos y usar la tienda.
      </div></noscript
    >
    <div class="admin-shell">
      <aside class="sidebar">
        <a class="brand" href="../index.html" aria-label="Caberti, inicio"
          >CABERTI <span data-icon="bow" aria-hidden="true"></span
        ></a>
        <div class="sidebar-label">Administración · vistas</div>
        <nav class="side-nav" aria-label="Administración">
          <a href="index.html"
            ><span data-icon="chart" aria-hidden="true"></span>Resumen</a
          ><a href="productos.html" aria-current="page"
            ><span data-icon="box" aria-hidden="true"></span>Productos</a
          ><a href="categorias.html"
            ><span data-icon="tag" aria-hidden="true"></span>Categorías</a
          ><a href="inventario.html"
            ><span data-icon="box" aria-hidden="true"></span>Inventario</a
          ><a href="pedidos.html"
            ><span data-icon="list" aria-hidden="true"></span>Pedidos</a
          >
        </nav>
        <div class="side-bottom">
          <a href="../index.html"
            ><span data-icon="home" aria-hidden="true"></span>Ver tienda</a
          ><a href="../acceso.html"
            ><span data-icon="exit" aria-hidden="true"></span>Salir de la
            demo</a
          >
        </div>
      </aside>
      <main class="admin-main" id="contenido">
        <div class="admin-top">
          <h1>Productos</h1>
          <div class="admin-user">
            <span class="avatar"
              ><span data-icon="user" aria-hidden="true"></span></span
            >Administrador
          </div>
        </div>
        <div class="demo-strip">
          <span
            ><strong>Panel de administración.</strong> Los cambios se guardan en la base de datos.</span
          ><button class="text-link" type="button" id="logout">
            Cerrar sesión
          </button>
        </div>
        <div class="toolbar">
          <label class="search"
            ><span class="sr-only">Buscar productos</span
            ><span data-icon="search" aria-hidden="true"></span
            ><input
              id="admin-search"
              type="search"
              placeholder="Buscar producto..." /></label
          ><button class="btn" id="new-product">+ Nuevo producto</button>
        </div>
        <div class="table-wrap" id="products-table"></div>
        <dialog
          class="modal"
          id="product-dialog"
          aria-labelledby="product-dialog-title"
        >
          <button
            type="button"
            class="close"
            data-close="product-dialog"
            aria-label="Cerrar"
          >
            ×
          </button>
          <h2 id="product-dialog-title">Nuevo producto</h2>
          <form id="admin-product-form">
            <input type="hidden" name="id" /><label class="field"
              >Nombre *<input name="name" required maxlength="120"
            /></label>
            <div class="form-row">
              <label class="field"
                >Categoría *<select
                  name="category"
                  id="product-category"
                  required
                ></select></label
              ><label class="field"
                >Precio (MXN) *<input
                  name="price"
                  type="number"
                  step="0.01"
                  min="0.01"
                  max="999999"
                  required
              /></label>
            </div>
            <div class="form-row">
              <label class="field"
                >Precio promocional<input
                  name="sale"
                  type="number"
                  min="0.01"
                  max="999999"
                  step="0.01"
                  placeholder="Opcional" /></label
              ><label class="field"
                >Stock mínimo *<input
                  name="min"
                  type="number"
                  min="0"
                  max="999999"
                  step="1"
                  required
                  value="3"
              /></label>
            </div>
            <label class="field"
              >Descripción<textarea
                name="description"
                maxlength="1000"
              ></textarea></label
            ><label class="field"
              >Foto del producto<input
                name="photo"
                type="file"
                accept="image/jpeg,image/png,image/webp"
              /><small
                >JPG, PNG o WebP de hasta 1 MB. Se conserva la foto actual si no
                eliges otra.</small
              ></label
            >
            <div class="actions">
              <label class="small"
                ><input name="custom" type="checkbox" /> Personalizable</label
              ><label class="small"
                ><input name="featured" type="checkbox" /> Destacado</label
              ><label class="small"
                ><input name="active" type="checkbox" checked /> Activo</label
              >
            </div>
            <p class="note">
              Las existencias iniciales se registran en Inventario.
            </p>
            <button class="btn full">Guardar producto</button>
          </form>
        </dialog>
      </main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
