<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CabertiStack: regalos, detalles y productos personalizados en Tapachula."
    />
    <meta name="theme-color" content="#a84732" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Clientes | CabertiStack</title>
    <link rel="stylesheet" href="../css/styles.css" />
    <script src="../js/data.js" defer></script>
    <script src="../js/admin.js" defer></script>
  </head>
  <body data-page="clientes" data-admin="true">
    <a class="skip-link" href="#contenido">Saltar al contenido</a
    ><noscript
      ><div class="noscript">
        Activa JavaScript para ver los productos y usar la tienda.
      </div></noscript
    >
    <div class="admin-shell">
      <aside class="sidebar">
        <a class="brand" href="../index.html" aria-label="CabertiStack, inicio"
          >CabertiStack <span data-icon="bow" aria-hidden="true"></span
        ></a>
        <div class="sidebar-label">Administración · vistas</div>
        <nav class="side-nav" aria-label="Administración">
          <a href="index.html"
            ><span data-icon="chart" aria-hidden="true"></span>Resumen</a
          ><a href="productos.html"
            ><span data-icon="box" aria-hidden="true"></span>Productos</a
          ><a href="categorias.html"
            ><span data-icon="tag" aria-hidden="true"></span>Categorías</a
          ><a href="inventario.html"
            ><span data-icon="box" aria-hidden="true"></span>Inventario</a
          ><a href="pedidos.html"
            ><span data-icon="list" aria-hidden="true"></span>Pedidos</a
          ><a href="clientes.html" aria-current="page"
            ><span data-icon="user" aria-hidden="true"></span>Clientes</a
          >
        </nav>
        <div class="side-bottom">
          <a href="../index.html"
            ><span data-icon="home" aria-hidden="true"></span>Ver tienda</a
          ><a href="../acceso.html"
            ><span data-icon="exit" aria-hidden="true"></span>Salir</a
          >
        </div>
      </aside>
      <main class="admin-main" id="contenido">
        <div class="admin-top">
          <h1>Clientes</h1>
          <div class="admin-user">
            <span class="avatar"
              ><span data-icon="user" aria-hidden="true"></span></span
            >Administrador
          </div>
        </div>
        <div class="admin-strip">
          <span
            ><strong>Panel de administración.</strong></span
          ><button class="text-link" type="button" id="logout">
            Cerrar sesión
          </button>
        </div>
        <div class="toolbar">
          <label class="search"
            ><span class="sr-only">Buscar cliente</span
            ><span data-icon="search" aria-hidden="true"></span
            ><input
              id="customer-search"
              type="search"
              placeholder="Buscar por nombre, correo o WhatsApp..."
          /></label>
        </div>
        <div class="table-wrap" id="customers-table"></div>
        <div class="pager" id="customers-pager" hidden></div>
      </main>
    </div>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
