<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="CabertiStack: regalos, detalles y productos personalizados en Tapachula."
    />
    <meta name="theme-color" content="#a84732" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Comprobante | CabertiStack</title>
    <link rel="stylesheet" href="css/styles.css" />
    <script src="js/data.js" defer></script>
    <script src="js/app.js" defer></script>
  </head>
  <body data-page="comprobante" data-admin="false">
    <a class="skip-link" href="#contenido">Saltar al contenido</a
    ><noscript
      ><div class="noscript">
        Activa JavaScript para ver los productos y usar la tienda.
      </div></noscript
    >
    <header class="site-header">
      <div class="container header-inner">
        <a class="brand" href="index.html" aria-label="CabertiStack, inicio"
          >CabertiStack <span data-icon="bow" aria-hidden="true"></span
        ></a>
        <nav class="nav" id="main-nav" aria-label="Navegación principal">
          <a href="index.html">Inicio</a><a href="catalogo.html">Catálogo</a
          ><a href="personalizados.html">Personalizados</a
          ><a href="contacto.html">Contacto</a>
        </nav>
        <a class="cart-link" href="pedido.html"
          ><span data-icon="bag" aria-hidden="true"></span
          ><span class="cart-text">Mi pedido</span
          ><span class="cart-count" data-cart-count>0</span></a
        ><button
          class="menu-toggle"
          id="menu-toggle"
          aria-controls="main-nav"
          aria-expanded="false"
          aria-label="Abrir menú"
        >
          <span data-icon="menu" aria-hidden="true"></span>
        </button>
      </div>
    </header>
    <main id="contenido">
      <div class="container">
        <div id="receipt"></div>
      </div>
    </main>
    <footer class="site-footer">
      <div class="container">
        <div class="footer-main">
          <a class="brand" href="index.html" aria-label="CabertiStack, inicio"
            >CabertiStack <span data-icon="bow" aria-hidden="true"></span></a
          ><span class="muted small"
            >Detalles que cuentan una historia. Tapachula, Chiapas.</span
          >
          <nav class="footer-links" aria-label="Enlaces del pie">
            <a href="catalogo.html">Catálogo</a
            ><a href="contacto.html">Contacto</a
            ><a href="/admin/index.html" data-admin-link hidden>Administración</a>
          </nav>
        </div>
        <div class="footer-note">
          <span>CabertiStack · Tapachula, Chiapas</span
          ><span
            >Precios y disponibilidad por confirmar con CabertiStack.</span
          >
        </div>
      </div>
    </footer>
    <div id="toast" class="toast" role="status" hidden></div>
  </body>
</html>
